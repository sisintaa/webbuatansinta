<!DOCTYPE html>
   <html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <!--=============== REMIXICONS ===============-->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" crossorigin="">

      <!--=============== CSS ===============-->
      <link rel="stylesheet" href="assets/css/styles.css">

      <title>Daftar ke Gudang Film</title>
   </head>
   <body>
      <div class="login">
         <img src="assets/img/login-bg.png" alt="image" class="login__bg">

         <form id="registerForm" action="" class="login__form">
            <h1 class="login__title">Silahkan Daftar</h1>

            <div class="login__inputs">
               <div class="login__box">
                  <input type="text" id="username" placeholder="Nama Pengguna" required class="login__input">
                  <i class="ri-mail-fill"></i>
               </div>

                <div class="login__box">
                  <input type="email" id="email" placeholder="Email Pengguna" required class="login__input">
                  <i class="ri-mail-fill"></i>
               </div>

               <div class="login__box">
                  <input type="password" id="password" placeholder="Kata Sandi" required class="login__input">
                  <i class="ri-lock-2-fill"></i>
               </div>
            </div>

            <button type="submit" class="login__button">Daftar</button>

            <div class="login__register">
               Sudah Punya Akun? <a href="index.html">Login</a>
            </div>
         </form>
      </div>
      <p id="message"></p>
      <script src="js/register.js" defer></script>
   </body>
</html>
